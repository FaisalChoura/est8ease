<div class="filter-panel" [class.open]="isFilterPanelOpen">
  <div class="filter-panel-header">
    <h3>More Filters</h3>
    <button (click)="toggleFilterPanel()">✖</button>
  </div>
  <div class="filter-panel-body">
    <h4>Additional Filters</h4>
    <button
      *ngFor="let chip of additionalChips"
      [class.selected]="chip.selected"
      (click)="toggleChip(chip)"
      class="chip"
    >
      {{ chip.label }}
    </button>
  </div>
</div>
