<div class="property-list">
  <!-- Wide Button at the Top -->
  <div class="wide-button-container">
    <button class="wide-button" (click)="toggleFilterPanel()">Filter Properties</button>
  </div>

  <app-property-filters [isFilterPanelOpen]="isFilterPanelOpen"></app-property-filters>

  <!-- Search Summary -->
<!--  <div class="search-summary" *ngIf="searchQuery">-->
<!--    <p>Search Results for: <strong>{{ searchQuery }}</strong></p>-->
<!--  </div>-->

  <!-- Property Cards -->
  <div *ngFor="let property of properties" class="property-card">
    <div class="property-details">
      <div class="property-title">{{property.bedrooms}} bedroom in {{ property.address }}</div>
    </div>
    <div class="property-description">
      Special Features:
      <ul>
        <li *ngFor="let key of getTrueKeys(property.extraDetails)">
          {{ key | titlecase }}
        </li>
      </ul>
    </div>

    <div class="property-price-size">
      <strong>{{ property.price }}</strong> • {{ property.size }} m2
      {{property.priceM2}}
    </div>
    <button class="view-details" (click)="openDetails(property.url)">View Details</button>
  </div>
</div>


<div *ngIf="showAlertModal" class="modal-backdrop">
  <div class="modal-popup">
    <h3>Get Alerts</h3>
    <p>Would you like to receive alerts when a property matching your search gets added?</p>
    <input
      type="email"
      [(ngModel)]="email"
      class="email-input"
      placeholder="Enter your email"
      required
    />
    <button class="modal-button" (click)="subscribeToAlerts()">Yes, Notify Me</button>
    <button class="modal-close" (click)="closeModal()">No, Thanks</button>
  </div>
</div>
